<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF 水印工具</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/pdf.min.js"></script>
  <script defer src="vendor/pdf.worker.min.js"></script>
  <script defer src="vendor/pdf-lib.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="app-header">
    <div><h1>PDF 水印工具</h1><span id="fileName">打开本地 PDF 后开始</span></div>
    <div class="header-actions"><label class="button" for="pdfFile">打开 PDF</label><input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden><button id="save" class="primary" disabled>导出 PDF</button></div>
  </header>
  <main>
    <aside class="controls">
      <section><h2>水印内容</h2>
        <div class="row"><label for="kind">类型</label><select id="kind"><option value="text">文字</option><option value="image">图片</option></select></div>
        <div class="row text-only"><label for="text">文字</label><textarea id="text" rows="2">水印</textarea></div>
        <div class="row text-only"><label for="font">系统字体</label><div class="inline"><select id="font"><option>Microsoft YaHei</option><option>SimSun</option><option>Arial</option><option>Segoe UI</option></select><button id="loadFonts" title="列出本机已安装的字体">读取字体</button></div></div>
        <div class="row text-only"><label for="fontSize">字号</label><div class="inline"><input id="fontSize" type="number" min="4" max="300" value="36"><span>pt</span></div></div>
        <div class="row text-only"><label for="textColor">文字颜色</label><input id="textColor" type="color" value="#d13535"></div>
        <div class="row image-only"><label for="imageFile">水印图片</label><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/gif"></div>
      </section>
      <section><h2>外观</h2>
        <div class="row"><label for="scale">缩放</label><div class="inline"><input id="scale" type="range" min="1" max="500" value="100"><output id="scaleValue">100%</output></div></div>
        <div class="row"><label for="opacity">不透明度</label><div class="inline"><input id="opacity" type="range" min="0" max="100" value="35"><output id="opacityValue">35%</output></div></div>
        <div class="row image-only"><label for="chroma"><input id="chroma" type="checkbox"> 启用色度键</label><div class="inline"><input id="chromaColor" type="color" value="#ffffff"><span>去除该颜色</span></div></div>
        <div class="row image-only"><label for="tolerance">色差容差</label><div class="inline"><input id="tolerance" type="range" min="0" max="255" value="20"><output id="toleranceValue">20</output></div></div>
      </section>
      <section><h2>水印位置</h2>
        <div class="row"><label for="positionMode">定位方式</label><select id="positionMode"><option value="grid">九宫格相对位置</option><option value="absolute">绝对位置</option></select></div>
        <div class="row grid-only"><label for="grid">九宫格</label><select id="grid"><option value="0">左上</option><option value="1">上中</option><option value="2">右上</option><option value="3">左中</option><option value="4" selected>正中</option><option value="5">右中</option><option value="6">左下</option><option value="7">下中</option><option value="8">右下</option></select></div>
        <div class="row grid-only"><label for="margin">边距</label><div class="inline"><input id="margin" type="number" min="0" max="1000" value="10" step="0.5"><span>mm</span></div></div>
        <div class="row absolute-only"><label for="x">X（向右）</label><div class="inline"><input id="x" type="number" value="20" step="0.5"><span>mm</span></div></div>
        <div class="row absolute-only"><label for="y">Y（向下）</label><div class="inline"><input id="y" type="number" value="20" step="0.5"><span>mm</span></div></div>
        <p class="hint">绝对坐标以页面左上角为原点，指向水印左上角。</p>
      </section>
      <section><h2>应用页面</h2>
        <div class="row"><label for="pageMode">选择方式</label><select id="pageMode"><option value="all">全部页面</option><option value="custom">指定页码或范围</option></select></div>
        <div class="row custom-only"><label for="pageSpec">页码</label><input id="pageSpec" type="text" placeholder="例如 1,3,5-8"></div>
        <p id="pageStatus" class="hint">尚未打开 PDF</p>
      </section>
      <p class="hint">图片默认宽度为页面宽度的 30%，再应用缩放。文字使用所选字体绘制并嵌入为高清透明图像。</p>
    </aside>
    <div class="workspace">
      <div class="toolbar"><button id="prev" disabled>上一页</button><span id="pageNumber">0 / 0</span><button id="next" disabled>下一页</button><div class="spacer"></div><label for="zoom">预览</label><select id="zoom"><option value="fit">适合窗口</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></div>
      <div id="canvasArea" class="canvas-area"><canvas id="preview" aria-label="PDF 页面预览"></canvas><div id="empty">打开 PDF 后在这里预览</div></div>
      <div id="message" role="status">就绪 · 全部处理在本机浏览器内完成</div>
    </div>
  </main>
</body>
</html>
